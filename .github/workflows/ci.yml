
# W3-T6 - Backend, Frontend and Full Week 3 Integration
name: CI - Backend, Frontend and Week 3 Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # JOB 1: Backend unit tests and PostgreSQL integration tests
  backend-tests:
    name: Backend - Unit Tests and PostgreSQL IT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: career_ci_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d career_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      AUTH_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/career_ci_test
      AUTH_TEST_DATABASE_USER: ci_user
      AUTH_TEST_DATABASE_PASSWORD: ${{ github.run_id }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend unit tests
        run: mvn -B -ntp -f backend/pom.xml clean test

      - name: Run PostgreSQL integration tests
        run: >-
          mvn -B -ntp -f backend/pom.xml
          -Ppostgres-it
          test-compile
          failsafe:integration-test
          failsafe:verify

  # JOB 2: Frontend build
  frontend-build:
    name: Frontend - TypeScript and Vite Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # JOB 3: Full end-to-end API integration using Docker Compose
  week3-integration:
    name: Week 3 - Docker API Integration (Full E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate isolated CI environment
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' scripts/init-env.sh
          bash scripts/init-env.sh
          docker compose config --quiet

      - name: Build Backend and Frontend images
        shell: bash
        run: |
          set -euo pipefail
          docker compose --progress plain build backend
          docker compose --progress plain build frontend

      - name: Start all services
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --no-build --wait
          docker compose ps

      - name: Verify Flyway V4 seed data
        shell: bash
        run: |
          set -euo pipefail

          stats=$(docker compose exec -T postgres sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc "SELECT COUNT(*), COUNT(DISTINCT occupation_id), COUNT(DISTINCT region) FROM market_demand_indicators;"')

          IFS='|' read -r rows occupations regions <<< "$stats"

          echo "LMI records: $rows"
          echo "Distinct occupations: $occupations"
          echo "Distinct regions: $regions"

          if (( rows < 100 || occupations < 10 || regions < 4 )); then
            echo "FAIL: LMI seed data does not meet W3-T6 requirements."
            exit 1
          fi

          migration=$(docker compose exec -T postgres sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc "SELECT COUNT(*) FROM flyway_schema_history WHERE version = '\''4'\'' AND success = true;"')

          if [[ "$migration" != "1" ]]; then
            echo "FAIL: Flyway V4 migration not successful."
            exit 1
          fi

          echo "PASS: Flyway V4 and LMI seed data verified."

      - name: Run full W3-T6 API integration tests
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -NonInteractive -File scripts/test-week3-integration.ps1

      - name: Show Docker logs on failure
        if: failure()
        shell: bash
        run: docker compose logs --tail=150

      - name: Stop CI containers
        if: always()
        shell: bash
        run: docker compose down --remove-orphans
