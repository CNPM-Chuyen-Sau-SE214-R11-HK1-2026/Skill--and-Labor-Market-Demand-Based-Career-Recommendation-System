
# W4-T6 - Backend, Frontend, Week 3 and Week 4 E2E Integration
name: CI - Backend, Frontend and W3-W4 Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # JOB 1: Backend unit tests and PostgreSQL integration tests
  backend-tests:
    name: Backend - Unit Tests and PostgreSQL IT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: career_ci_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d career_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      AUTH_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/career_ci_test
      AUTH_TEST_DATABASE_USER: ci_user
      AUTH_TEST_DATABASE_PASSWORD: ${{ github.run_id }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend unit tests
        run: mvn -B -ntp -f backend/pom.xml clean test

      - name: Run PostgreSQL integration tests
        run: >-
          mvn -B -ntp -f backend/pom.xml
          -Ppostgres-it
          test-compile
          failsafe:integration-test
          failsafe:verify

  # JOB 2: Frontend build
  frontend-build:
    name: Frontend - TypeScript and Vite Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # JOB 3: Week 3 and Week 4 Docker E2E
  week3-integration:
    name: Week 3 + Week 4 - Docker API Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Demo accounts are enabled only for this CI test job.
    env:
      W4_DEMO_ACCOUNTS_ENABLED: "on"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate isolated CI environment
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' scripts/init-env.sh
          bash scripts/init-env.sh
          docker compose config --quiet

      - name: Build Backend and Frontend images
        shell: bash
        run: |
          set -euo pipefail
          docker compose --progress plain build backend
          docker compose --progress plain build frontend

      - name: Start all services
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --no-build --wait
          docker compose ps

      # Verify Week 3 Flyway V4 and LMI seed data
      - name: Verify Flyway V4 seed data
        shell: bash
        run: |
          set -euo pipefail

          stats=$(docker compose exec -T postgres sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc "SELECT COUNT(*), COUNT(DISTINCT occupation_id), COUNT(DISTINCT region) FROM market_demand_indicators;"')

          IFS='|' read -r rows occupations regions <<< "$stats"

          echo "LMI records: $rows"
          echo "Distinct occupations: $occupations"
          echo "Distinct regions: $regions"

          if (( rows < 100 || occupations < 10 || regions < 4 )); then
            echo "FAIL: LMI seed data does not meet W3-T6 requirements."
            exit 1
          fi

          migration=$(docker compose exec -T postgres sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc "SELECT COUNT(*) FROM flyway_schema_history WHERE version = '\''4'\'' AND success = true;"')

          if [[ "$migration" != "1" ]]; then
            echo "FAIL: Flyway V4 migration not successful."
            exit 1
          fi

          echo "PASS: Flyway V4 and LMI seed data verified."

      # Keep the original Week 3 E2E test
      - name: Run full W3-T6 API integration tests
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -NonInteractive -File scripts/test-week3-integration.ps1

      # Week 4: Check Flyway V5, demo users and frontend
      - name: Verify Flyway V5 and demo accounts
        shell: bash
        run: |
          set -euo pipefail

          db_user=$(docker compose exec -T postgres printenv POSTGRES_USER)
          db_name=$(docker compose exec -T postgres printenv POSTGRES_DB)

          result=$(docker compose exec -T postgres \
            psql -U "$db_user" -d "$db_name" \
            -v ON_ERROR_STOP=1 -tAc "
              SELECT
                (SELECT COUNT(*) FROM flyway_schema_history
                 WHERE version = '5' AND success = true),
                (SELECT COUNT(*) FROM users
                 WHERE email IN (
                   'w4-demo-candidate@demo.invalid',
                   'w4-demo-admin@demo.invalid'
                 ) AND is_active = true);
            ")

          echo "Flyway V5 | Active demo accounts: $result"

          if [[ "$result" != "1|2" ]]; then
            echo "FAIL: Flyway V5 or demo accounts missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/ > /dev/null

          echo "PASS: Flyway V5, demo accounts and frontend."

      # Week 4: Install Python for E2E testing
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Week 4: Automated E2E test
      - name: Run W4-T6 E2E baseline
        shell: bash
        env:
          W4_DEMO_CANDIDATE_PASSWORD: "CandidateDemoW4!2026"
          W4_DEMO_ADMIN_PASSWORD: "AdminDemoW4!2026"
        run: |
          set -euo pipefail

          python --version
          python -m py_compile scripts/test-week4-e2e.py
          python scripts/test-week4-e2e.py

      # Diagnostics when a CI step fails
      - name: Show Docker logs on failure
        if: failure()
        shell: bash
        run: docker compose logs --tail=150

      # Stop containers without deleting the database volume
      - name: Stop CI containers
        if: always()
        shell: bash
        run: docker compose down --remove-orphans
