
# W3-T6 - Backend, Frontend and Stage 1 Docker integration smoke tests
name: CI - Backend, Frontend and Week 3 Integration

# Chay khi co Pull Request vao main hoac push len main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# CI chi can quyen doc ma nguon
permissions:
  contents: read

jobs:
  # JOB 1: Kiem thu Backend
  backend-tests:
    name: Backend - Unit Tests and PostgreSQL IT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # PostgreSQL rieng cho moi lan chay CI
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: career_ci_test
          POSTGRES_USER: ci_user
          # Mat khau tam chi dung trong runner CI
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d career_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      # Cau hinh duoc AuthPostgresIT su dung
      AUTH_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/career_ci_test
      AUTH_TEST_DATABASE_USER: ci_user
      AUTH_TEST_DATABASE_PASSWORD: ${{ github.run_id }}

    steps:
      - name: Lay ma nguon tu GitHub
        uses: actions/checkout@v4

      - name: Cai dat Java 17 va Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Chay Backend Unit Tests
        run: mvn -B -ntp -f backend/pom.xml clean test

      - name: Chay AuthPostgresIT voi PostgreSQL that
        run: >-
          mvn -B -ntp -f backend/pom.xml
          -Ppostgres-it
          test-compile
          failsafe:integration-test
          failsafe:verify

  # JOB 2: Kiem tra Frontend build
  frontend-build:
    name: Frontend - TypeScript and Vite Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Lay ma nguon tu GitHub
        uses: actions/checkout@v4

      - name: Cai dat Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cai dat dependencies
        run: npm ci

      - name: Kiem tra TypeScript va build Vite
        run: npm run build

  # JOB 3: W3-T6 - integration smoke tests with real Docker services
  # These are the 19 available-API checks. Full W3 E2E must be added
  # once LMI Import, Recommendation and Skill Gap endpoints are merged.
  week3-integration:
    name: Week 3 - Docker API Integration (Stage 1)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate isolated CI environment
        shell: bash
        run: |
          # The existing Windows-authored shell script uses CRLF endings.
          # Normalize only in this temporary CI checkout.
          sed -i 's/\r$//' scripts/init-env.sh
          bash scripts/init-env.sh
          docker compose config --quiet

      - name: Build Backend then Frontend images
        shell: bash
        run: |
          docker compose --progress plain build backend
          docker compose --progress plain build frontend

      - name: Start PostgreSQL, Backend and Frontend
        shell: bash
        run: |
          docker compose up -d --no-build --wait